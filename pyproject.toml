[project]
name = "wiki-kings"
version = "0.1.0"
description = "Parse Wikipedia infoboxes into Markdown + image files"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "wikitextparser>=0.55",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
wiki-kings = "wiki_kings.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
